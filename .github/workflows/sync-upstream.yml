name: Sync LinkedIn Skills from upstream

on:
  schedule:
    - cron: '17 3 * * *' # 08:47 Asia/Kolkata (UTC+05:30)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: upstream-sync-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout this fork
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Merge original repository updates
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/sergebulaev/linkedin-skills.git
          git fetch --no-tags upstream main
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Already up to date."
            exit 0
          fi
          if git merge-base --is-ancestor HEAD upstream/main; then
            git merge --ff-only upstream/main
          else
            git merge --no-edit --no-ff upstream/main
          fi
          git push origin HEAD:main
